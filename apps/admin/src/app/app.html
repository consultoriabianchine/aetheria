<header>
  <a class="brand" routerLink="/creatures">Aetheria · Central de Comando</a>
  <nav>
    <a routerLink="/creatures" routerLinkActive="active">Criaturas</a>
    <a routerLink="/outfits" routerLinkActive="active">Outfits</a>
    <a routerLink="/animation-sets" routerLinkActive="active">Animation Sets</a>
    <a routerLink="/maps" routerLinkActive="active">Mapas</a>
    <a routerLink="/hunts" routerLinkActive="active">Hunts</a>
    <a routerLink="/combat" routerLinkActive="active">Combat</a>
    <a routerLink="/items" routerLinkActive="active">Items</a>
  </nav>
  <div class="token">
    <label for="token">Admin token</label>
    <input id="token" type="text" [value]="api.token()" (change)="api.setToken($any($event.target).value)" placeholder="dev-admin-token" />
  </div>
</header>
<main>
  <router-outlet />
</main>
