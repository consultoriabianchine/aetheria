services:
  postgres:
    image: postgres:16-alpine
    container_name: aetheria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aetheria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aetheria_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aetheria}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aetheria} -d ${POSTGRES_DB:-aetheria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  game-server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    container_name: aetheria-server
    working_dir: /app/apps/game-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aetheria}:${POSTGRES_PASSWORD:-aetheria_dev}@postgres:5432/${POSTGRES_DB:-aetheria}?schema=public
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(4000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aetheria-web
    restart: unless-stopped
    depends_on:
      - game-server
    ports:
      - "4200:80"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: aetheria-admin
    restart: unless-stopped
    depends_on:
      - game-server
    ports:
      - "4300:80"

  tibiawiki-importer:
    profiles: ["importer"]
    build:
      context: .
      dockerfile: apps/tibiawiki-importer/Dockerfile
    container_name: aetheria-importer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aetheria}:${POSTGRES_PASSWORD:-aetheria_dev}@postgres:5432/${POSTGRES_DB:-aetheria}?schema=public
      TIBIAWIKI_CATEGORY_URL: ${TIBIAWIKI_CATEGORY_URL:-https://www.tibiawiki.com.br/wiki/Human%C3%B3ides}
      SCRAPER_CONCURRENCY: ${SCRAPER_CONCURRENCY:-1}
      SCRAPER_DELAY_MS: ${SCRAPER_DELAY_MS:-2500}
      SCRAPER_TIMEOUT_MS: ${SCRAPER_TIMEOUT_MS:-15000}
      SCRAPER_MAX_RETRIES: ${SCRAPER_MAX_RETRIES:-5}
    volumes:
      - importer-assets:/app/assets
      - importer-exports:/app/exports

volumes:
  pgdata:
  importer-assets:
  importer-exports:
